<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsorship | UTD Girls Who Code</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <main>

        <section class="contact-intro">
            <h1>SPONSORSHIP INTEREST</h1>
            <p>
                Thank you for your interest in supporting
                Girls Who Code at UT Dallas!
                Complete the form below to request our sponsorship packet.
            </p>
        </section>

        <section class="get-in-touch">
            <h2>REQUEST SPONSORSHIP PACKET</h2>

            <!-- Form submission integration will be added later -->
            <form class="contact-form" id="sponsorship-form">

                <p class="form-group">
                    <label for="contact-name">Contact Name</label>
                    <input type="text" id="contact-name"
                           name="contact_name" required>
                </p>

                <p class="form-group">
                    <label for="company-name">Company Name</label>
                    <input type="text" id="company-name"
                           name="company_name" required>
                </p>

                <p class="form-group">
                    <label for="company-email">Company Email</label>
                    <input type="email" id="company-email"
                           name="company_email" required>
                </p>

                <p class="form-group">
                    <label for="message">Message (Optional)</label>
                    <textarea id="message" name="message"
                              rows="5"></textarea>
                </p>

                <button type="submit" class="submit-button">
                    Request Sponsorship Packet
                </button>

            </form>
        </section>

    </main>

</body>

</html>
